# Kaify local / CI Supabase stack.
# Never point db reset at a linked remote project from automation.
# Defaults match upstream `supabase init` ports + JWT placeholder.

project_id = "kaify-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
# Standard local JWT secret (matches historical Supabase CLI defaults).
jwt_secret = "super-secret-jwt-token-with-at-least-32-characters-long"

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = true

[analytics]
enabled = false
