name: Security Scan

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  zap-baseline:
    name: OWASP ZAP baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: vars.STAGING_URL != ''
    env:
      STAGING_URL: ${{ vars.STAGING_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ env.STAGING_URL }}
          cmd_options: "-a"

  zap-status:
    name: ZAP staging gate status
    runs-on: ubuntu-latest
    steps:
      - name: Report STAGING_URL / waiver
        run: |
          if [ -z "${{ vars.STAGING_URL }}" ]; then
            echo "::notice::STAGING_URL unset — ZAP baseline skipped. Active waiver: docs/operations/evidence/td008-zap-waiver.md"
          else
            echo "::notice::STAGING_URL is set — zap-baseline job will run when scheduled or dispatched."
          fi

  sbom:
    name: SBOM + OSV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate CycloneDX SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.json

      - name: OSV scan
        uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: |-
            --lockfile=package-lock.json
