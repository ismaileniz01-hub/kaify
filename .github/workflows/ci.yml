name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Build-safe placeholders: the app must compile without live secrets.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      CSRF_SECRET: placeholder-csrf-secret-for-ci-only
      ADMIN_HUB_PASSWORD: placeholder-hub-password-for-ci-only
      ADMIN_HUB_SECRET: placeholder-hub-hmac-for-ci-only
      CRON_SECRET: placeholder-cron-secret-for-ci-only
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:strict

      - name: Typecheck
        run: npm run typecheck

      - name: i18n parity
        run: npm run i18n:check

      - name: Test + coverage gate
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Bundle budget gate
        run: npm run budget:bundle

      - name: Start production server
        run: npm run start &
        env:
          PORT: "3000"

      - name: Wait for /api/health
        run: |
          for i in $(seq 1 30); do
            if curl -sf -A "Mozilla/5.0" http://127.0.0.1:3000/api/health; then
              echo "Server ready"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become ready"
          exit 1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lighthouse CI budgets
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          echo "Using Chrome at $CHROME_PATH"
          npx --yes @lhci/cli@0.14.0 autorun --config=lighthouserc.cjs
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

      - name: Playwright public smoke
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          CI: "true"

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: k6 load smoke (SLO gate)
        run: k6 run scripts/load-test/k6-smoke.js
        env:
          BASE_URL: http://127.0.0.1:3000
          K6_VUS: "5"
          K6_DURATION: "10s"

  database:
    name: Supabase DB · RLS · RPC
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      checks: write
      actions: read

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Never target a linked remote / production project from this job.
      SUPABASE_INTERNAL_NO_LINKED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Docker preflight
        run: |
          set -euo pipefail
          docker version
          docker info
          df -h
          free -h || true

      # Postgres-only first — proves migration reproducibility without Studio/GoTrue health flakiness.
      - name: Start local Postgres (db only)
        run: |
          set -euo pipefail
          supabase --version
          set +e
          supabase db start --debug 2>&1 | tee /tmp/supabase-db-start.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "db start failed with $status"
            exit "$status"
          fi
          supabase status || true

      # Deterministic reproducibility: reset → migrate → reset → migrate again.
      - name: Reset database from migrations (pass 1)
        run: |
          set -euo pipefail
          supabase db reset --local --yes --debug 2>&1 | tee /tmp/supabase-db-reset-1.log

      - name: Reset database from migrations (pass 2)
        run: |
          set -euo pipefail
          supabase db reset --local --yes --debug 2>&1 | tee /tmp/supabase-db-reset-2.log

      # Full local stack for JWT auth (GoTrue + API). Ignore peripheral health if needed.
      - name: Start Auth/API stack
        run: |
          set -euo pipefail
          set +e
          supabase start \
            --exclude studio,edge-runtime,logflare,vector \
            --ignore-health-check \
            --debug 2>&1 | tee /tmp/supabase-start.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "==== supabase start failed (exit $status) ===="
            tail -n 200 /tmp/supabase-start.log || true
            docker ps -a || true
            exit "$status"
          fi
          supabase status

      - name: Commit failure diagnostics to branch
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p audit/remediation
          {
            echo "# CI DB failure ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            echo
            echo "sha: ${GITHUB_SHA}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            docker version || true
            echo
            for f in /tmp/supabase-db-start.log /tmp/supabase-db-reset-1.log /tmp/supabase-db-reset-2.log /tmp/supabase-start.log; do
              if [ -f "$f" ]; then
                echo "## $(basename "$f")"
                echo '```'
                tail -n 400 "$f"
                echo '```'
                echo
              fi
            done
            echo "## docker ps -a"
            echo '```'
            docker ps -a || true
            echo '```'
          } > audit/remediation/_CI_DB_FAILURE_LOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/remediation/_CI_DB_FAILURE_LOG.md
          git commit -m "ci: capture Wave 2 DB failure diagnostics [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}" || true

      - name: Export local Supabase keys
        run: |
          eval "$(supabase status -o env)"
          echo "SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=${ANON_KEY}" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"
          echo "DATABASE_URL=${DB_URL}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}" >> "$GITHUB_ENV"
          case "${API_URL}" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *) echo "Refusing non-local API_URL=${API_URL}"; exit 1 ;;
          esac

      - name: Run database authorization suite
        run: npm run test:db
        env:
          KAIFY_DB_TESTS: "1"

      - name: Upload supabase logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-db-logs
          path: |
            /tmp/supabase-db-start.log
            /tmp/supabase-db-reset-1.log
            /tmp/supabase-db-reset-2.log
            /tmp/supabase-start.log
          if-no-files-found: ignore

      - name: Dump Supabase diagnostics on failure
        if: failure()
        run: |
          supabase status || true
          docker ps -a || true
          docker logs supabase_db_kaify-local 2>&1 | tail -n 200 || true

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || supabase stop || true

  audit:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Gitleaks PR scan needs parent commit history (default shallow clone breaks `SHA^..SHA`).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high and above)
        run: npm audit --audit-level=high

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
