# Gitleaks config for Kaify CI.
# `useDefault` keeps every built-in rule. Without it this file defined zero
# rules and the scan could not find anything (audit K-058).
title = "kaify"

[extend]
useDefault = true

[allowlist]
description = "Public, documented Supabase local-demo keys and historical CI diagnostics"
# The two JWTs below are the well-known demo keys that every `supabase start`
# prints (iss "supabase-demo"); they only work against a local stack.
regexes = [
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9\.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0''',
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0\.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU''',
]
# Historical diagnostics written by an old CI step (removed); local demo values only.
paths = [
  '''audit/remediation/_CI_DB_FAILURE_LOG\.md''',
]
