workflows:
  kaify-ios:
    name: Kaify iOS
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: Kaify

    environment:
      ios_signing:
        # Explicit profile reference only — excludes legacy "Kaify App Store".
        # (Cannot mix with distribution_type / bundle_identifier per Codemagic docs.)
        provisioning_profiles:
          - profile: kaify_app_store_healthkit
            environment_variable: KAIFY_PROVISIONING_PROFILE
      vars:
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
        NATIVE_API_BASE_URL: "https://kaifyai.org"
        NEXT_PUBLIC_API_BASE_URL: "https://kaifyai.org"
        # Public client values only — never service_role / SMTP / secrets in native bundle.
        # Prefer NEXT_PUBLIC_*; assert-native-public-env also maps SUPABASE_URL / SUPABASE_ANON_KEY.
        NEXT_PUBLIC_SUPABASE_URL: "https://urnetodzvszmddzdazdj.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVybmV0b2R6dnN6bWRkemRhemRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4MDQ3NTQsImV4cCI6MjA5ODM4MDc1NH0.EemHnCv-3wf36S-6u5-GxGRJ-1P4uYCOJ-Zl0U-BKxQ"
      node: 22
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Assert native public auth env
        script: |
          # Map alternate public names if a Codemagic group uses them.
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] && [ -n "${SUPABASE_URL:-}" ]; then
            export NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL"
          fi
          if [ -z "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ] && [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            export NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          fi
          unset CAPACITOR_SERVER_URL || true
          node scripts/native/assert-native-public-env.mjs

      - name: Build local native shell
        script: |
          unset CAPACITOR_SERVER_URL || true
          npm run native:build

      - name: Sync Capacitor iOS (native-dist only)
        script: |
          unset CAPACITOR_SERVER_URL || true
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios
          node scripts/native/verify-native-bundle.mjs

      - name: Set iOS build metadata
        script: |
          BUILD_NUMBER="${BUILD_NUMBER:-${CM_BUILD_NUMBER:-18}}"
          if [ "$BUILD_NUMBER" -lt 18 ]; then BUILD_NUMBER=18; fi
          export BUILD_NUMBER
          echo "Using iOS CFBundleVersion=$BUILD_NUMBER"
          perl -0pi -e "s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" ios/App/App.xcodeproj/project.pbxproj
          perl -0pi -e 's/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = 1.0.2;/g' ios/App/App.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist

      - name: Configure Apple signing
        script: |
          # Main app project only; CapApp-SPM / other projects must not pick profiles.
          if [ -z "${KAIFY_PROVISIONING_PROFILE:-}" ]; then
            echo "KAIFY_PROVISIONING_PROFILE is empty — expected Codemagic profile kaify_app_store_healthkit"
            exit 1
          fi
          xcode-project use-profiles \
            --project ios/App/App.xcodeproj \
            --profile "$KAIFY_PROVISIONING_PROFILE"

      - name: Build signed IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Internal testing only — no App Store production submission.
        submit_to_app_store: false

  kaify-android:
    name: Kaify Android
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      vars:
        NATIVE_API_BASE_URL: "https://kaifyai.org"
        NEXT_PUBLIC_API_BASE_URL: "https://kaifyai.org"
        NEXT_PUBLIC_SUPABASE_URL: "https://urnetodzvszmddzdazdj.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVybmV0b2R6dnN6bWRkemRhemRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4MDQ3NTQsImV4cCI6MjA5ODM4MDc1NH0.EemHnCv-3wf36S-6u5-GxGRJ-1P4uYCOJ-Zl0U-BKxQ"
      node: 22
      java: 17

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Assert native public auth env
        script: |
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] && [ -n "${SUPABASE_URL:-}" ]; then
            export NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL"
          fi
          if [ -z "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ] && [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            export NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          fi
          unset CAPACITOR_SERVER_URL || true
          node scripts/native/assert-native-public-env.mjs

      - name: Build local native shell
        script: |
          unset CAPACITOR_SERVER_URL || true
          npm run native:build

      - name: Sync Capacitor Android (native-dist only)
        script: |
          unset CAPACITOR_SERVER_URL || true
          npx cap sync android
          node scripts/native/verify-native-bundle.mjs

      - name: Set Android version metadata
        script: |
          VERSION_CODE="${VERSION_CODE:-${CM_BUILD_NUMBER:-18}}"
          if [ "$VERSION_CODE" -lt 18 ]; then VERSION_CODE=18; fi
          echo "Using Android versionCode=$VERSION_CODE versionName=1.0.2"
          sed -i.bak -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i.bak -E 's/versionName "[^"]+"/versionName "1.0.2"/' android/app/build.gradle

      - name: Assemble debug APK
        script: |
          cd android
          ./gradlew :app:assembleDebug -x lint -x test

      - name: Bundle release AAB when signing is configured
        script: |
          cd android
          if [ -n "${CM_KEYSTORE_PATH:-}" ] || [ -f key.properties ] || [ -f app/key.properties ]; then
            ./gradlew :app:bundleRelease -x lint -x test
          else
            echo "No Android signing config — skipping bundleRelease (debug APK still produced)."
          fi

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
