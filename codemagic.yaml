workflows:
  kaify-ios:
    name: Kaify iOS
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: KaifyApple

    environment:
      ios_signing:
        provisioning_profiles:
          - kaify_appstore_profile
        certificates:
          - kaify_distribution
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build web application
        script: |
          npm run build:cap

      - name: Create and synchronize iOS project
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Configure Apple signing
        script: |
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration